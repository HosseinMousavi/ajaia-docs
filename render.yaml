# One-click deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Render will prompt for DATABASE_URL: paste your Neon (or Supabase) Postgres
# connection string. Render's free disk is wiped on restart, so a hosted
# Postgres is what makes documents persist.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO_USERS
        value: "true"
